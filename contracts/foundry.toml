[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Именованный RPC тестнета: forge ... --rpc-url base_sepolia
[rpc_endpoints]
base_sepolia = "https://sepolia.base.org"

# Верификация контрактов на Basescan (нужен BASESCAN_API_KEY в окружении)
[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532, url = "https://api-sepolia.basescan.org/api" }
